[project]
name = "randomfun2026solvers"
version = "0.1.0"
description = "External batch solvers for randomfun2026 infrastructure"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.13.4",
]

[project.scripts]
randomfun2026solvers = "randomfun2026solvers.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solvers/python/randomfun2026solvers"]

[tool.hatch.build.targets.wheel.force-include]
"solvers/python/randomfun2026solvers/py.typed" = "randomfun2026solvers/py.typed"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
