[project]
name = "littleman-tools"
version = "0.1.0"
description = "Tools for running and scoring Little Man programs"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.13.4",
]

[project.scripts]
littleman = "littleman_tools.runner:main"
littleman-score = "littleman_tools.scoring:main"
littleman-compile = "littleman_tools.compiler_cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["littleman_tools"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run must stay fast enough to use as a loop (target: under ~30s).
# Anything dominated by a search or a long wasm run is marked `slow` and excluded;
# run it with `pytest -m slow`, or the whole suite with `pytest -m ""`.
# `-n auto`: ~193 of these tests shell out to node/wasm, so they are dominated by
# process startup and parallelise almost linearly (25s -> under 10s on 10 cores).
addopts = "-m 'not slow' -n auto"
markers = [
  "slow: minutes, not seconds — optimiser searches and long engine runs",
]
